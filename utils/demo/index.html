<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trợ lý Luật Lao động</title>
<style>
:root{
  --bg:#f7f5f0; --surface:#ffffff; --surface-2:#f1eee7; --ink:#1f2328; --ink-2:#4a5059; --mute:#80868f; --line:#e6e1d6;
  --brand:#0f9b8e; --brand-2:#14b8a6; --brand-ink:#ffffff; --brand-soft:#e3f6f3; --brand-softer:#f0faf8;
  --yes:#15803d; --yes-bg:#e7f6ec; --no:#c2410c; --no-bg:#fdeee4; --wait:#a16207; --wait-bg:#fdf5dc;
  --shadow:0 1px 2px rgba(31,35,40,.04),0 4px 16px rgba(31,35,40,.06); --shadow-lg:0 8px 32px rgba(31,35,40,.10);
  --r:18px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14171a; --surface:#1c2024; --surface-2:#23282d; --ink:#eceef0; --ink-2:#c2c7cd; --mute:#8b929a; --line:#2d3338;
  --brand:#2cc4b4; --brand-2:#5eead4; --brand-ink:#06201d; --brand-soft:#123532; --brand-softer:#162826;
  --yes:#5fd38a; --yes-bg:#15301f; --no:#fb9a6a; --no-bg:#3a2216; --wait:#f2c55c; --wait-bg:#352c12;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); --shadow-lg:0 8px 32px rgba(0,0,0,.4);
}}
*{box-sizing:border-box}
html,body{height:100%;overflow-x:hidden}
.hello h1,.hello p{overflow-wrap:anywhere}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}

/* đầu trang */
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:12px 20px;
  background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.logo{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(135deg,var(--brand),var(--brand-2));box-shadow:0 4px 12px color-mix(in srgb,var(--brand) 35%,transparent)}
.brand b{display:block;font-size:15.5px;line-height:1.2}
.brand span{font-size:12.5px;color:var(--mute)}
.new{margin-left:auto;display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;font-size:14px;color:var(--ink-2);
  border:1px solid var(--line);background:var(--surface);transition:background .15s}
.new:hover{background:var(--surface-2)}
.new[hidden]{display:none}

/* vùng hội thoại */
#scroll{flex:1;overflow-y:auto}
.wrap{max-width:780px;margin:0 auto;padding:8px 20px 24px}

/* màn chào */
.hello{padding:9vh 0 16px;text-align:center;animation:rise .5s ease both}
.hello .orb{width:64px;height:64px;margin:0 auto 22px;border-radius:22px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(135deg,var(--brand),var(--brand-2));box-shadow:0 10px 30px color-mix(in srgb,var(--brand) 35%,transparent)}
.hello h1{font-size:clamp(26px,4.5vw,34px);line-height:1.25;margin:0 0 10px;letter-spacing:-.01em;font-weight:650}
.hello h1 em{font-style:normal;background:linear-gradient(90deg,var(--brand),var(--brand-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hello p{color:var(--ink-2);margin:0 auto;max-width:520px}
.sugs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:34px}
.sug{min-width:0;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);
  transition:transform .15s,border-color .15s,box-shadow .15s;display:flex;gap:12px;align-items:flex-start}
.sug:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--brand) 45%,var(--line));box-shadow:var(--shadow-lg)}
.sug .ic{flex:none;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand)}
.sug .tx{font-size:14.5px;line-height:1.5;color:var(--ink);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* tin nhắn */
.msg{display:flex;gap:12px;margin:22px 0;animation:rise .3s ease both}
.msg.me{justify-content:flex-end}
.me .bubble{background:linear-gradient(135deg,var(--brand),color-mix(in srgb,var(--brand) 80%,var(--brand-2)));color:var(--brand-ink);
  border-radius:var(--r) var(--r) 6px var(--r);padding:11px 16px;max-width:min(560px,85%);white-space:pre-wrap;word-wrap:break-word;
  box-shadow:0 3px 12px color-mix(in srgb,var(--brand) 25%,transparent)}
.me .when{display:block;font-size:12px;opacity:.82;margin-top:4px}
.av{flex:none;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:#fff;margin-top:2px;
  background:linear-gradient(135deg,var(--brand),var(--brand-2))}
.ai .body{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:6px var(--r) var(--r) var(--r);
  padding:16px 18px;box-shadow:var(--shadow)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:4px 11px;border-radius:999px;margin-bottom:10px}
.pill.yes{color:var(--yes);background:var(--yes-bg)}.pill.no{color:var(--no);background:var(--no-bg)}.pill.wait{color:var(--wait);background:var(--wait-bg)}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.lead{font-weight:600;font-size:16.5px;margin:0 0 8px;line-height:1.5}
.text{color:var(--ink-2);margin:0;white-space:pre-wrap}
.cites{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.cites h4{margin:0 0 8px;font-size:12.5px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;padding:6px 12px;border-radius:999px;background:var(--brand-softer);
  color:color-mix(in srgb,var(--brand) 85%,var(--ink));border:1px solid color-mix(in srgb,var(--brand) 22%,transparent);transition:background .15s}
.chip:hover,.chip[aria-expanded="true"]{background:var(--brand-soft)}
.chip svg{transition:transform .2s}.chip[aria-expanded="true"] svg{transform:rotate(180deg)}
.law{margin-top:10px;background:var(--surface-2);border-radius:12px;padding:12px 14px;font-size:14.5px;line-height:1.6;animation:rise .2s ease both}
.law .t{font-weight:600}.law .h{color:var(--mute);font-size:13px;margin-bottom:6px}.law p{margin:4px 0 0;white-space:pre-wrap}
.foot{margin-top:14px;font-size:12.5px;color:var(--mute);display:flex;flex-wrap:wrap;gap:4px 14px}
.foot span{display:inline-flex;align-items:center;gap:5px}

/* đang trả lời */
.dots{display:inline-flex;gap:5px;align-items:center;height:20px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--brand);opacity:.35;animation:blink 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
.status{margin-left:10px;color:var(--mute);font-size:14px}

/* ô nhập */
.dock{padding:0 20px max(14px,env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.composer{max-width:780px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow-lg);
  padding:10px 10px 10px 18px;transition:border-color .15s,box-shadow .15s}
.composer:focus-within{border-color:color-mix(in srgb,var(--brand) 55%,var(--line));box-shadow:var(--shadow-lg),0 0 0 4px color-mix(in srgb,var(--brand) 12%,transparent)}
textarea{width:100%;border:0;outline:0;resize:none;background:transparent;color:var(--ink);font:inherit;line-height:1.55;max-height:200px;padding:6px 0;display:block}
textarea::placeholder{color:var(--mute)}
.bar{display:flex;align-items:center;gap:8px;margin-top:4px}
.date{position:relative;display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);padding:6px 12px;border-radius:999px;
  background:var(--surface-2);cursor:pointer}
.date input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.send{margin-left:auto;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;
  background:linear-gradient(135deg,var(--brand),var(--brand-2));transition:transform .15s,opacity .15s}
.send:hover{transform:scale(1.05)}.send:disabled{opacity:.35;cursor:default;transform:none}
.hint{max-width:780px;margin:8px auto 0;text-align:center;font-size:12px;color:var(--mute)}

@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes blink{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
@media (max-width:640px){
  header{padding:10px 16px}.wrap{padding:4px 16px 20px}.dock{padding:0 12px max(10px,env(safe-area-inset-bottom))}
  .sugs{grid-template-columns:minmax(0,1fr)}.hello{padding-top:5vh}.av{display:none}.brand span{display:none}
  .new .lbl{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="logo" aria-hidden="true">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M7 21h10M5 7h14M5 7l-3 7a4 4 0 0 0 6 0L5 7zm14 0-3 7a4 4 0 0 0 6 0l-3-7z"/></svg>
  </div>
  <div class="brand"><b>Trợ lý Luật Lao động</b><span>Hỏi đáp theo quy định có hiệu lực tại từng thời điểm</span></div>
  <button class="new" id="new" hidden title="Cuộc trò chuyện mới">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    <span class="lbl">Cuộc trò chuyện mới</span>
  </button>
</header>

<div id="scroll"><div class="wrap" id="chat"></div></div>

<div class="dock">
  <form class="composer" id="form">
    <textarea id="q" rows="1" placeholder="Hỏi về giấy phép lao động, cho thuê lại lao động…" aria-label="Câu hỏi"></textarea>
    <div class="bar">
      <label class="date" title="Trả lời theo các quy định có hiệu lực vào ngày này">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
        <span id="dlabel">Áp dụng luật hôm nay</span>
        <input type="date" id="d" aria-label="Ngày áp dụng">
      </label>
      <button class="send" id="send" type="submit" disabled aria-label="Gửi">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </div>
  </form>
  <div class="hint">Thông tin chỉ để tham khảo, không thay cho tư vấn của luật sư. Mỗi câu hỏi được trả lời riêng, hãy nêu đủ tình huống trong câu.</div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = iso => { const [y,m,d] = String(iso).split("-"); return `${d}/${m}/${y}`; };
const ICON = {
  scale:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M7 21h10M5 7h14M5 7l-3 7a4 4 0 0 0 6 0L5 7zm14 0-3 7a4 4 0 0 0 6 0l-3-7z"/></svg>',
  chat:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>',
  down:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>',
  cal:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18"/></svg>',
  info:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>',
};
let today = new Date().toISOString().slice(0, 10), examples = [], busy = false;

/* màn chào */
function hello() {
  const sugs = examples.slice(0, 4).map((e, i) =>
    `<button class="sug" data-i="${i}"><span class="ic">${ICON.chat}</span><span class="tx">${esc(e.cau_hoi)}</span></button>`).join("");
  $("#chat").innerHTML = `<section class="hello">
    <div class="orb">${ICON.scale.replace(/18/g, "28")}</div>
    <h1>Xin chào! Mình là <em>trợ lý Luật Lao động</em></h1>
    <p>Mô tả tình huống của bạn, mình sẽ đối chiếu với quy định đang có hiệu lực và chỉ ra điều khoản làm căn cứ. Hiện mình am hiểu nhất về <b>giấy phép lao động cho người nước ngoài</b> và <b>cho thuê lại lao động</b>.</p>
    ${sugs ? `<div class="sugs">${sugs}</div>` : ""}
  </section>`;
  document.querySelectorAll(".sug").forEach(b => b.onclick = () => {
    const e = examples[+b.dataset.i];
    setDate(e.ngay);
    send(e.cau_hoi);
  });
  $("#new").hidden = true;
}

function setDate(iso) {
  $("#d").value = iso;
  $("#dlabel").textContent = iso === today ? "Áp dụng luật hôm nay" : `Áp dụng luật tại ${fmt(iso)}`;
}

/* tin nhắn */
function add(html, cls) {
  if ($(".hello")) $("#chat").innerHTML = "";
  const el = document.createElement("div");
  el.className = "msg " + cls;
  el.innerHTML = html;
  $("#chat").appendChild(el);
  $("#scroll").scrollTo({top: $("#scroll").scrollHeight, behavior: "smooth"});
  $("#new").hidden = false;
  return el;
}

/* đúng hay không là kết quả của bộ suy luận (ket_qua); trang chỉ ghép chữ của nhận định vào câu, không tự phủ định nhận định */
const VERDICT = {
  ket_luan_duoc: ["yes", "Đúng", p => `Với tình huống bạn nêu, nhận định «${p}» là đúng.`],
  bi_bac: ["no", "Không đúng", p => `Với tình huống bạn nêu, nhận định «${p}» là không đúng.`],
  chua_du_can_cu: ["wait", "Cần thêm thông tin", p => `Mình chưa đủ thông tin để kết luận «${p}». Bạn nêu thêm tình tiết giúp mình nhé.`],
};

function answer(j) {
  const v = VERDICT[j.ket_qua];
  if (!v) {
    const text = j.ket_qua === "ngoai_pham_vi"
      ? "Câu hỏi này nằm ngoài những quy định mình đang nắm. Hiện mình trả lời được các câu về giấy phép lao động cho người nước ngoài và cho thuê lại lao động (giấy phép, ký quỹ). Bạn thử hỏi theo hướng đó nhé."
      : j.ket_qua === "khong_tra_loi"
      ? "Các quy định liên quan đến câu hỏi này đang có chỗ chưa thống nhất, nên mình chưa thể đưa ra câu trả lời đáng tin cậy."
      : "Xin lỗi, mình chưa hiểu được câu hỏi này. Bạn thử diễn đạt lại, nêu rõ ai, làm gì, trong bao lâu nhé.";
    return `<p class="text">${esc(text)}</p>`;
  }
  const lead = j.nhan_dinh ? v[2](j.nhan_dinh) : String(j.ket_luan || "").replace(/^Kết luận:\s*/, "");
  let h = `<span class="pill ${v[0]}"><i></i>${v[1]}</span><p class="lead">${esc(lead)}</p>`;
  if (j.giai_thich) h += `<p class="text">${esc(j.giai_thich)}</p>`;
  if (j.can_cu && j.can_cu.length) {
    h += `<div class="cites"><h4>Căn cứ pháp lý</h4><div class="chips">` +
      j.can_cu.map((b, i) => `<button class="chip" data-i="${i}" aria-expanded="false">${esc(cap(b.ten))} ${ICON.down}</button>`).join("") +
      `</div><div class="laws"></div></div>`;
  }
  h += `<div class="foot"><span>${ICON.cal}Theo quy định có hiệu lực ngày ${esc(fmt(j.ngay))}</span>` +
       (j.giai_thich && j.giai_thich_ai ? `<span>${ICON.info}Phần giải thích do AI viết, hãy đối chiếu căn cứ nguyên văn</span>` : "") + `</div>`;
  return h;
}
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;

function wireCites(el, j) {
  el.querySelectorAll(".chip").forEach(c => c.onclick = () => {
    const box = el.querySelector(".laws"), open = c.getAttribute("aria-expanded") === "true";
    el.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-expanded", "false"));
    if (open) { box.innerHTML = ""; return; }
    const b = j.can_cu[+c.dataset.i];
    c.setAttribute("aria-expanded", "true");
    box.innerHTML = `<div class="law"><div class="t">${esc(cap(b.ten))}</div>${b.tieu_de ? `<div class="h">${esc(b.tieu_de)}</div>` : ""}` +
      (b.cau_dan ? `<p>${esc(b.cau_dan)}</p>` : "") + `<p>${esc(b.chu)}</p></div>`;
  });
}

/* gửi câu hỏi */
async function send(q) {
  q = q.trim();
  if (!q || busy) return;
  busy = true; $("#send").disabled = true;
  const day = $("#d").value || today;
  add(`<div class="bubble">${esc(q)}${day !== today ? `<span class="when">Theo luật tại ${esc(fmt(day))}</span>` : ""}</div>`, "me");
  $("#q").value = ""; grow();
  const el = add(`<div class="av">${ICON.scale}</div><div class="body"><span class="dots"><i></i><i></i><i></i></span><span class="status">Đang tra cứu quy định…</span></div>`, "ai");
  const t0 = Date.now();
  const tick = setInterval(() => {
    const s = (Date.now() - t0) / 1000, st = el.querySelector(".status");
    if (st) st.textContent = s < 6 ? "Đang tra cứu quy định…" : s < 20 ? "Đang đối chiếu các điều khoản…" : "Đang soạn câu trả lời, câu hỏi mới có thể mất đến 1–2 phút…";
  }, 1000);
  let html, j = null;
  try {
    const r = await fetch("/api/hoi", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({cau_hoi: q, ngay: day})});
    j = r.ok ? await r.json() : null;
    html = j ? answer(j) : `<p class="text">Xin lỗi, mình chưa xử lý được câu hỏi này. Bạn kiểm tra lại câu hỏi (không để trống, không quá dài) rồi thử lại nhé.</p>`;
  } catch (e) {
    html = `<p class="text">Mất kết nối tới máy chủ. Bạn kiểm tra máy chủ demo còn chạy không rồi thử lại nhé.</p>`;
  }
  clearInterval(tick);
  el.querySelector(".body").innerHTML = html;
  if (j) wireCites(el, j);
  busy = false; $("#send").disabled = !$("#q").value.trim();
  $("#q").focus();
}

function grow() { const t = $("#q"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 200) + "px"; }
$("#q").addEventListener("input", () => { grow(); $("#send").disabled = busy || !$("#q").value.trim(); });
$("#q").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send($("#q").value); } });
$("#form").onsubmit = e => { e.preventDefault(); send($("#q").value); };
$("#d").onchange = () => setDate($("#d").value || today);
$("#new").onclick = () => { setDate(today); hello(); $("#q").focus(); };

fetch("/api/info").then(r => r.json()).then(i => {
  today = i.hom_nay || today;
  const seen = new Set();  // bộ dev có câu trùng chữ khác ngày: gợi ý mỗi câu một lần
  examples = (i.vi_du || []).filter(e => !seen.has(e.cau_hoi) && seen.add(e.cau_hoi));
